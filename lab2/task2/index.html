<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo">
        <img src="https://images.seeklogo.com/logo-png/30/2/instagram-new-2016-logo-png_seeklogo-302599.png" width="60px">
    </div>
    <div class="container">
        <div class="left">
            <h1>See everyday moments <br> from your <span class="gradient">close friends</span></h1>>.
            <img src="https://static.cdninstagram.com/rsrc.php/v4/yF/r/reN9rvYdLTB.png" class = "phone">
        </div>
        <div class="right">
            <div class="login-part">
                <p>Log into Instagram</p>
                <form action="#">
                    <input type="text" placeholder="Mobile phone,username or email">
                    <input type="password" placeholder="Password">
                    <button class="login">Log in</button>
                    <button class="forgot">Forgot password?</button>
                </form>
            </div>
            <div class="other-part">
                <div class="facebook">
                    <a href="#">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/500px-Facebook_Logo_%282019%29.png" height="20px">
                        <p>Log in with Facebook</p>
                    </a>
                </div>
                <button class="new-acc">Create new account</button>
                <div class="meta">
                    <img src="https://cdn.pixabay.com/photo/2021/12/14/22/29/meta-6871457_1280.png" height="30px">
                    <p>Meta</p>
                </div>
            </div>

        </div>
</body>
</html>
